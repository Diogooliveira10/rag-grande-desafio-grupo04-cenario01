bases:
  # ---------------------------------------------------------------------
  # NATUREZA: estruturada
  # ---------------------------------------------------------------------
  - base_id: contratos_estruturado
    natureza: estruturada
    fonte: "PNCP - API de consulta v1/v3 (/v1/contratos)"
    acesso:
      tipo: rest_api
      endpoint: "https://pncp.gov.br/api/consulta/v1/contratos"
      params:
        dataInicial: "2025-01-01"
        dataFinal: "2025-03-31"   # trimestre — evita puxar o volume nacional inteiro sem filtro de UF
      paginacao:
        campo_pagina: "pagina"
        campo_tamanho: "tamanhoPagina"
      tamanho_pagina: 50
      rate_limit_seg: 1.0
     
      filtro_local:
        campo: "unidadeOrgao.ufSigla"
        operador: "=="
        valor: "RJ"
    selecao_deterministica: true
    campo_vigencia: "dataVigenciaFim"
    metadados_extras:
      - orgaoEntidade.cnpj
      - orgaoEntidade.razaoSocial
      - unidadeOrgao.municipioNome
      - valorGlobal
      - objetoContrato
      - numeroControlePNCP
      - tipoContrato.nome

  # ---------------------------------------------------------------------
  # NATUREZA: agregada
  # ---------------------------------------------------------------------
  - base_id: pca_agregado
    natureza: agregada
    fonte: "PNCP - API de consulta v1/v3 (/v1/pca/)"
    acesso:
      tipo: rest_api
      endpoint: "https://pncp.gov.br/api/consulta/v1/pca/"
      params:
        anoPca: 2025
        codigoClassificacaoSuperior: "8920"   # CATMAT classe: PRODUTOS DE PANIFICAÇÃO E CEREAIS
      paginacao:
        campo_pagina: "pagina"
        campo_tamanho: "tamanhoPagina"
      tamanho_pagina: 50
      rate_limit_seg: 1.0
     
      filtro_local:
        campo: "orgaoEntidadeCnpj"
        valor_ref: "data/config/cnpjs_rj.json"
    selecao_deterministica: true

  # ---------------------------------------------------------------------
  # NATUREZA: normativa
  # ---------------------------------------------------------------------
  - base_id: editais_normativo
    natureza: normativa
    fonte: "Lei 14.133/2021 (Planalto) + editais/TR anexados às contratações do PNCP"
    acesso:
      tipo: http_pdf
      urls:
        - "https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm"
      rate_limit_seg: 1.0
    
    selecao_deterministica: true
    formato: [html, pdf, zip]
    licenca: "Domínio público"
    sensitivity_default: publico
    campo_vigencia: "data_publicacao"

  